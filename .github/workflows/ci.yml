name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest  # the app imports winsound, which only exists on Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m unittest test_app -v
